[package]
name = "daymark-control"
version = "0.1.0"
description = "Private local control desk for Daymark"
authors = ["Daymark"]
edition = "2021"
default-run = "daymark-control"

[[bin]]
name = "daymark-control"
path = "src/main.rs"

[[bin]]
name = "DaymarkRuntime"
path = "src/bin/daymark-runtime.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
